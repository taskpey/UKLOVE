  $('call').style.display='none';$('rv').srcObject=null;$('lv').srcObject=null;cid2='';if(msg){const t=$('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}}
$('ce').onclick=hang;$('cA').onclick=()=>startCall(false);$('cV').onclick=()=>startCall(true);
$('cm').onclick=()=>{if(!ls)return;const t=ls.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('cm').innerHTML=t.enabled?I.mic:I.micoff}};

/* ---------- Notification (app khuli ho tab) ---------- */
function notify(n,x){if(cfg.notif===false)return;const t=$('toast');t.textContent='💬 '+n+': '+x;t.style.display='block';setTimeout(()=>t.style.display='none',4000);
  safe(()=>cfg.vib&&navigator.vibrate&&navigator.vibrate(200));playTone(cfg.tone);
  safe(()=>{if(document.hidden&&window.Notification&&Notification.permission==='granted')new Notification('UK Love App',{body:n+': '+x})})}
</script></body></html>
